# Database ingress is deny-by-default for every selected database pod.
# The allowed clients below match the REDIS_HOST and MONGO_URI values in this directory.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-mongo-only-auth
spec:
  podSelector:
    matchLabels:
      app: auth-mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth
      ports:
        - protocol: TCP
          port: 27017
---
