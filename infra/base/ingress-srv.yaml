# =============================================================================
# LOAD TEST / DEVELOPMENT STACK -- NO RATE LIMITING
# =============================================================================
# Identical to infra/k8s/ingress-srv.yaml except that every
# `nginx.ingress.kubernetes.io/limit-*` annotation has been removed, so the k6
# tests measure the services instead of nginx rejecting requests with 429.
#
# Apply this INSTEAD of infra/k8s/ingress-srv.yaml, not on top of it:
#
#   kubectl apply -f infra/base/
#
# The per-service Redis limiters (socket-gateway / positions) are disabled by
# POSITION_RATE_LIMIT_DISABLED in the matching *-depl.yaml files here.
# =============================================================================

# ---- Positions REST API ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: positions-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: ticket-com-tls
      hosts:
        - ticket.com
  rules:
    - host: ticket.com
      http:
        paths:
          - path: /api/positions/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: positions-srv
                port:
                  number: 3000
---
# ---- Socket.io ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socket-gateway-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "socket-gateway-srv"
spec:
  ingressClassName: nginx
  tls:
    - secretName: ticket-com-tls
      hosts:
        - ticket.com
  rules:
    - host: ticket.com
      http:
        paths:
          - path: /socket.io/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: socket-gateway-srv
                port:
                  number: 3000
---
