apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: racer

# The production manifests are the safe default. Use "-p test" for the
# load-test stack, which disables the application and ingress rate limits.
profiles:
  - name: test
  - name: production

---
# ---------- shared infrastructure ----------
apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: nats
deploy:
  kubectl:
    manifests:
        - infra/k8s/nats-depl.yaml
profiles:
  - name: test
    deploy:
      kubectl:
        manifests:
            - infra/base/nats-depl.yaml
  - name: production

---
apiVersion: skaffold/v2beta29
