apiVersion: skaffold/v2beta25
kind: Config
deploy: 
  kubectl:
    # there are two options base and k8s , base is used for testing beceause it not rate limited
    # and used when testing with k6 , but k6 is used for the deploy
    # all the tests are running well , you can add intesity to the tests if you want ,
    # but i dont suggest that if you are running them locally since it extremly heavy on the pc
    # you can run them on virtual macine in the cloud
    manifests:
      - ./infra/base/*
build:
  local:
    push: false
  artifacts:
    - image: ahmed0ahmed/racer-positions
      context: positions
      docker:
        dockerfile: Dockerfile
      sync: 
        manual:
          - src: 'src/**/*.ts'
            dest : .
    - image: ahmed0ahmed/racer-auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: ahmed0ahmed/racer-races
      context: races
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    # the saga orchestrator for the races service
    - image: ahmed0ahmed/racer-races-saga-orchestrator
      context: races-saga-orchestrator
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: ahmed0ahmed/racer-archive
      context: archive
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: ahmed0ahmed/racer-client
      context: client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: ahmed0ahmed/racer-socket-gateway
      context: socket-gateway
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
