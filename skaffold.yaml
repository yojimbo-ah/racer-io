apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: racer

# Kustomize owns the environment-specific Kubernetes manifests. Production is
# the safe default; use "-p test" for the load-test overlay.
build:
  local:
    push: false
  artifacts:
    - image: ahmed0ahmed/racer-positions
      context: positions
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-races
      context: races
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-races-saga-orchestrator
      context: races-saga-orchestrator
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-archive
      context: archive
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-client
      context: client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-socket-gateway
      context: socket-gateway
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: ahmed0ahmed/racer-predictions
      context: predictions
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.py"
            dest: .

deploy:
  kubectl:
    manifests:
      - infra/kustomize/overlays/production

profiles:
  - name: production
  - name: test
    deploy:
      kubectl:
        manifests:
          - infra/kustomize/overlays/test
