---
# ---------- application services ----------
apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: auth
requires:
  - configs: [auth-mongo, blacklist-redis, nats, otel]
build:
  artifacts:
    - image: ahmed0ahmed/racer-auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
deploy:
  kubectl:
    manifests:
        - infra/k8s/auth-depl.yaml
profiles:
  - name: test
    deploy:
      kubectl:
        manifests:
            - infra/base/auth-depl.yaml
  - name: production

